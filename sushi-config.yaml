id: fhir.acme.example.org.cancerpathologyreport
canonical: https://fhir.acme.example.org/CancerPathologyReport
version: 0.1.0
name: CancerPathologyReport
title: Cancer Pathway Interoperability (Proof of Concept)
description: PROOF OF CONCEPT ONLY - not an authoritative source. Interoperability along a cancer pathway - screening, diagnostic testing, genomics, treatment monitoring, patient-reported outcomes and palliative care - using IHE laboratory workflow (HL7 v2) for orders and results and FHIR Documents for sharing. Report models for the Cancer Pathology Report (COSD Pathology v5) and the Palliative Care Record (SCCI1580), built on HL7 Europe Laboratory and aligned with mCODE
releaseLabel: proof-of-concept
status: draft
experimental: true
publisher:
  name: Kevin Mayfield
  url: https://github.com/KevinMayfield
license: CC-BY-4.0
fhirVersion: 4.0.1
jurisdiction: urn:iso:std:iso:3166#GB "United Kingdom of Great Britain and Northern Ireland"
copyrightYear: 2026+

dependencies:
  hl7.fhir.eu.base: 2.0.1
  hl7.fhir.eu.laboratory: 2.1.0
  hl7.fhir.eu.extensions.r4: 1.3.1
  hl7.fhir.extensions.r5: 4.0.1
  hl7.fhir.uv.sdc: 3.0.0

FSHOnly: false
parameters:
  shownav: true
  path-expansion-params: ../../input/_resources/exp-params.json
  apply-contact: 'true'
  apply-jurisdiction: 'true'
  apply-publisher: 'true'
  apply-version: 'true'

